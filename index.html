<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwell</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
      <h1>
          Maxwell
          <span id="info"> </span> 
      </h1>
      <!------------------ top panel 1 ---------------->
      <section>
        <select id="createMode" aria-label="Select" required>
            <option value="Info">Info</option>
            <option value="Charge" selected >Charge</option>
            <option value="Wire">Wire</option>
            <!-- <option value="Magnet">Magnet</option> -->
        </select>

        <input id="infoParams" type="text" value="W: 500, H: 500, name: '' " style="display: none;">
        <input id="chargeParams" type="text" value="q: 1, vx: 1, vy: 1, m: 1, fixed: 0" style="display: inline;">
        <input id="wireParams" type="text" value="sm: 0.01, x: 250, j: 1" style="display: none;">
        <input id="magnetParams" type="text" value="" style="display: none;">

        <button id="runButton" title="Run | Stop">Run</button>
      </section>
      <!------------------ top panel 2 ---------------->
      <section>
        <label>
            E <span id="eSpan"></span>
            <input id="eRange" type="range" min="0", max="0.01" step="0.0001" value="0.0001" title="Electric">
        </label>
        <label>
            B <span id="bSpan"></span>
            <input id="bRange" type="range" min="0", max="20" value="10" title="Magnetic">
        </label>  
        <label> Trace
          <input id="tracingCheckbox" type="checkbox" title="trace mode" checked> 
        </label>

        <button id="helpButton" title="Help" class="outline">Help</button>      
      </section>

      <!-- ------------------canvases------------------  -->
      <div class="canvas-frame">
        <canvas id="canvas2" tabindex="0" width="500" height="500"  ></canvas>
        <canvas id="canvas" width="500" height="500" tabindex="0"></canvas>
      </div>

      <!-- ------------------bottom panel------------------  -->
      <div class="bottom-panel">
          <button id="saveSceneButton" class="scene-btn" title="Save script">✔</button>
          <select id="savedInStore" class="scene-textarea" ></select>
          <button id="loadSceneButton" class="scene-btn" title="Delete script">❌</button>
      </div>
 
  </div>
  

  <script type="module" src="main.js"></script>
</body>
</html>
